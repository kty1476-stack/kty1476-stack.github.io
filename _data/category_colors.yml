# 카테고리 색상표
#
#  fixed   : 이미 쓰고 있는 카테고리의 고정 색. 여기 적힌 카테고리는 색이 절대 바뀌지 않는다.
#  auto    : 표에 없는 새 카테고리에 자동으로 배정되는 색.
#            "그 카테고리의 첫 글이 올라온 순서"대로 위에서부터 하나씩 배정되므로,
#            새 카테고리가 생겨도 기존 카테고리 색은 그대로 유지된다.
#            자동 배정된 색을 계속 쓰고 싶으면 fixed 로 옮겨 적으면 된다.
#  default : 카테고리가 아닌 곳(태그 페이지 등)에서 쓰는 기본색.

fixed:
  맛있는녀석들: "#c1443c"    # 레드
  생활의달인: "#4c8c4a"      # 그린
  전현무계획: "#d9762e"      # 앰버
  인기검색맛집: "#3c7a89"    # 틸
  정부지원금: "#215c9e"      # 네이비
  TV맛집: "#b0452e"          # 테라코타
  발로뛴 맛집: "#7a5c8c"     # 퍼플

auto:
  - "#6b4c9a"   # 딥 퍼플
  - "#157a72"   # 청록
  - "#b03a6e"   # 로즈
  - "#a85a1e"   # 러스트
  - "#3b4a9e"   # 인디고
  - "#2f6b4f"   # 포레스트
  - "#8c2f4a"   # 버건디
  - "#4a6fa5"   # 슬레이트 블루
  - "#7d3c8c"   # 플럼
  - "#5a6b2f"   # 올리브

default: "#b0452e"
