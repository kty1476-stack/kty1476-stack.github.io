<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9642F"/>
      <stop offset="100%" stop-color="#8C3B1B"/>
    </linearGradient>
    <radialGradient id="pancake" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#F0B84E"/>
      <stop offset="70%" stop-color="#D99A34"/>
      <stop offset="100%" stop-color="#B87A24"/>
    </radialGradient>
    <radialGradient id="plateShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg1)"/>

  <!-- subtle texture dots -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="120" cy="90" r="4"/>
    <circle cx="1080" cy="120" r="5"/>
    <circle cx="980" cy="60" r="3"/>
    <circle cx="60" cy="500" r="4"/>
    <circle cx="1120" cy="520" r="4"/>
  </g>

  <!-- category badge -->
  <rect x="64" y="64" width="176" height="52" rx="26" fill="#ffffff"/>
  <text x="152" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#8C3B1B" text-anchor="middle">전현무계획</text>

  <!-- plate shadow -->
  <ellipse cx="620" cy="330" rx="260" ry="255" fill="url(#plateShadow)"/>

  <!-- pancake body -->
  <circle cx="600" cy="300" r="230" fill="url(#pancake)" stroke="#7A4A16" stroke-width="6"/>

  <!-- fried texture blobs -->
  <g fill="#A9701F" opacity="0.55">
    <ellipse cx="520" cy="210" rx="34" ry="20" transform="rotate(-15 520 210)"/>
    <ellipse cx="690" cy="250" rx="30" ry="18" transform="rotate(20 690 250)"/>
    <ellipse cx="600" cy="380" rx="38" ry="22" transform="rotate(5 600 380)"/>
    <ellipse cx="480" cy="360" rx="26" ry="16" transform="rotate(-25 480 360)"/>
    <ellipse cx="700" cy="400" rx="24" ry="15" transform="rotate(15 700 400)"/>
  </g>

  <!-- mung bean speckles -->
  <g fill="#F4E2A8">
    <circle cx="560" cy="260" r="6"/>
    <circle cx="640" cy="300" r="5"/>
    <circle cx="580" cy="340" r="5"/>
    <circle cx="650" cy="230" r="4"/>
    <circle cx="510" cy="300" r="4"/>
    <circle cx="660" cy="360" r="5"/>
  </g>

  <!-- scallion strips -->
  <g stroke="#4E7A3C" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="540" y1="230" x2="580" y2="270"/>
    <line x1="640" y1="340" x2="600" y2="380"/>
    <line x1="480" y1="330" x2="520" y2="360"/>
    <line x1="670" y1="270" x2="640" y2="240"/>
  </g>

  <!-- bottom title bar -->
  <rect x="0" y="470" width="1200" height="160" fill="#000000" opacity="0.32"/>
  <text x="64" y="545" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#ffffff">노포의 손맛, 빈대떡</text>
  <text x="64" y="590" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="500" fill="#ffffff" opacity="0.85">남대문시장 부원면옥</text>
</svg>

