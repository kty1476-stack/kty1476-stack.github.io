<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9642F"/>
      <stop offset="55%" stop-color="#B24F25"/>
      <stop offset="100%" stop-color="#8C3B1B"/>
    </linearGradient>
    <radialGradient id="plateShadow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateRim5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6CCBC"/>
    </linearGradient>
    <radialGradient id="plateInner5" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3EEE4"/>
      <stop offset="100%" stop-color="#E5DCCB"/>
    </radialGradient>
    <linearGradient id="pork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBEADD"/>
      <stop offset="30%" stop-color="#F3D2BA"/>
      <stop offset="60%" stop-color="#E9B694"/>
      <stop offset="100%" stop-color="#D99C76"/>
    </linearGradient>
    <linearGradient id="porkFat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7EC"/>
      <stop offset="100%" stop-color="#F6E3CC"/>
    </linearGradient>
    <radialGradient id="broth5" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#F0DCC4"/>
      <stop offset="55%" stop-color="#E0C29B"/>
      <stop offset="100%" stop-color="#C79E6E"/>
    </radialGradient>
    <radialGradient id="ssamjang" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8A4A2C"/>
      <stop offset="100%" stop-color="#4A2513"/>
    </radialGradient>
    <linearGradient id="chopstick5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B76A32"/>
      <stop offset="100%" stop-color="#7C4419"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>

  <g opacity="0.06" stroke="#FFFFFF" stroke-width="2">
    <line x1="-100" y1="70" x2="1300" y2="570"/>
    <line x1="-100" y1="-30" x2="1300" y2="470"/>
  </g>
  <g opacity="0.08" fill="#ffffff">
    <circle cx="120" cy="90" r="4"/>
    <circle cx="1080" cy="120" r="5"/>
    <circle cx="990" cy="60" r="3"/>
    <circle cx="60" cy="510" r="4"/>
    <circle cx="1140" cy="220" r="4"/>
  </g>

  <!-- category badge -->
  <rect x="64" y="64" width="176" height="52" rx="26" fill="#ffffff"/>
  <text x="152" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#8C3B1B" text-anchor="middle">전현무계획</text>

  <!-- main plate shadow -->
  <ellipse cx="560" cy="410" rx="290" ry="62" fill="url(#plateShadow5)"/>

  <!-- main plate -->
  <ellipse cx="560" cy="350" rx="278" ry="106" fill="url(#plateRim5)"/>
  <ellipse cx="560" cy="345" rx="250" ry="90" fill="url(#plateInner5)"/>
  <ellipse cx="560" cy="345" rx="150" ry="52" fill="none" stroke="#E0D6C4" stroke-width="3" opacity="0.6"/>

  <!-- lettuce leaves tucked behind pork -->
  <g fill="#4F8A47">
    <path d="M 400 320 C 360 280 380 220 440 216 C 460 250 450 300 420 330 Z" opacity="0.9"/>
    <path d="M 700 330 C 745 288 738 226 682 216 C 656 252 660 302 690 336 Z" opacity="0.9"/>
  </g>
  <g fill="#6BAE5F" opacity="0.7">
    <path d="M 410 312 C 388 288 398 252 430 244 C 440 268 434 296 418 314 Z"/>
    <path d="M 690 320 C 714 296 706 258 674 250 C 662 274 668 302 684 322 Z"/>
  </g>

  <!-- sliced bossam pork, fanned shingled slices leaning in a row -->
  <g>
    <g transform="translate(452,352) rotate(-16)">
      <rect x="-58" y="-26" width="116" height="52" rx="20" fill="url(#pork)" stroke="#B87A4E" stroke-width="3"/>
      <rect x="-58" y="-26" width="116" height="18" rx="9" fill="url(#porkFat)"/>
    </g>
    <g transform="translate(508,336) rotate(-9)">
      <rect x="-58" y="-26" width="116" height="52" rx="20" fill="url(#pork)" stroke="#B87A4E" stroke-width="3"/>
      <rect x="-58" y="-26" width="116" height="18" rx="9" fill="url(#porkFat)"/>
    </g>
    <g transform="translate(566,324) rotate(-2)">
      <rect x="-58" y="-26" width="116" height="52" rx="20" fill="url(#pork)" stroke="#B87A4E" stroke-width="3"/>
      <rect x="-58" y="-26" width="116" height="18" rx="9" fill="url(#porkFat)"/>
    </g>
    <g transform="translate(624,332) rotate(7)">
      <rect x="-58" y="-26" width="116" height="52" rx="20" fill="url(#pork)" stroke="#B87A4E" stroke-width="3"/>
      <rect x="-58" y="-26" width="116" height="18" rx="9" fill="url(#porkFat)"/>
    </g>
    <g transform="translate(680,350) rotate(15)">
      <rect x="-58" y="-26" width="116" height="52" rx="20" fill="url(#pork)" stroke="#B87A4E" stroke-width="3"/>
      <rect x="-58" y="-26" width="116" height="18" rx="9" fill="url(#porkFat)"/>
    </g>
  </g>

  <!-- steamed cabbage / kimchi accent -->
  <ellipse cx="500" cy="386" rx="46" ry="16" fill="#C4302A" opacity="0.85"/>
  <ellipse cx="500" cy="382" rx="34" ry="10" fill="#8E1E19" opacity="0.6"/>

  <!-- garlic + chili slices -->
  <g fill="#FBF6E8">
    <ellipse cx="640" cy="372" rx="10" ry="7"/>
    <ellipse cx="660" cy="380" rx="9" ry="6"/>
  </g>
  <g fill="#D8402A">
    <ellipse cx="612" cy="378" rx="16" ry="6" transform="rotate(18 612 378)"/>
  </g>

  <!-- ssamjang dipping dish -->
  <ellipse cx="778" cy="404" rx="58" ry="24" fill="#F4EEE2"/>
  <ellipse cx="778" cy="400" rx="42" ry="16" fill="url(#ssamjang)"/>

  <!-- small kalguksu bowl to the side, referencing the noodle soup -->
  <ellipse cx="950" cy="470" rx="118" ry="34" fill="url(#plateShadow5)" opacity="0.5"/>
  <ellipse cx="950" cy="430" rx="112" ry="46" fill="url(#plateRim5)"/>
  <ellipse cx="950" cy="426" rx="96" ry="36" fill="url(#broth5)"/>
  <g fill="none" stroke="#FCF3E4" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M 900 420 C 916 408 928 430 944 418"/>
    <path d="M 930 434 C 946 422 958 444 974 432"/>
    <path d="M 960 416 C 976 404 988 426 1000 414"/>
  </g>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 930 372 C 924 352 942 342 936 320"/>
    <path d="M 968 376 C 962 356 980 346 974 324"/>
  </g>

  <!-- chopsticks -->
  <g transform="rotate(22 300 400)">
    <rect x="220" y="392" width="150" height="9" rx="4.5" fill="url(#chopstick5)"/>
    <rect x="220" y="408" width="150" height="9" rx="4.5" fill="url(#chopstick5)"/>
  </g>

  <!-- bottom title bar -->
  <rect x="0" y="470" width="1200" height="160" fill="#000000" opacity="0.34"/>
  <text x="64" y="545" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="800" fill="#ffffff">웨이팅 1시간 반의 보쌈칼국수</text>
  <text x="64" y="590" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="500" fill="#ffffff" opacity="0.85">성수동 훼미리손칼국수보쌈</text>
</svg>
