<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#215C9E"/>
      <stop offset="100%" stop-color="#0C2C52"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF1F6"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="70%" stop-color="#F0B93B"/>
      <stop offset="100%" stop-color="#C98A15"/>
    </radialGradient>
    <radialGradient id="docShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>

  <g opacity="0.07" fill="#ffffff">
    <circle cx="120" cy="90" r="4"/>
    <circle cx="1080" cy="120" r="5"/>
    <circle cx="70" cy="520" r="4"/>
    <circle cx="1120" cy="520" r="4"/>
  </g>

  <!-- category badge -->
  <rect x="64" y="64" width="176" height="52" rx="26" fill="#ffffff"/>
  <text x="152" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#0C2C52" text-anchor="middle">정부지원금</text>

  <!-- document shadow -->
  <ellipse cx="520" cy="420" rx="220" ry="40" fill="url(#docShadow)"/>

  <!-- document (rotated slightly) -->
  <g transform="translate(430,330) rotate(-6)">
    <path d="M -160 -190 L 90 -190 L 160 -120 L 160 190 L -160 190 Z" fill="url(#paper)" stroke="#C7D0DC" stroke-width="4"/>
    <path d="M 90 -190 L 90 -120 L 160 -120 Z" fill="#C7D0DC"/>
    <!-- text lines -->
    <g stroke="#9BB0C7" stroke-width="10" stroke-linecap="round">
      <line x1="-120" y1="-70" x2="80" y2="-70"/>
      <line x1="-120" y1="-20" x2="100" y2="-20"/>
      <line x1="-120" y1="30" x2="60" y2="30"/>
      <line x1="-120" y1="80" x2="90" y2="80"/>
    </g>
    <!-- checkmark stamp -->
    <circle cx="70" cy="130" r="46" fill="none" stroke="#2E9E5B" stroke-width="8"/>
    <path d="M 48 130 L 64 148 L 96 108" fill="none" stroke="#2E9E5B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- won coin -->
  <circle cx="770" cy="290" r="140" fill="url(#coin)" stroke="#A97110" stroke-width="6"/>
  <text x="770" y="330" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="150" font-weight="800" fill="#7A4E0C" text-anchor="middle">₩</text>

  <!-- calendar badge -->
  <g transform="translate(910,430)">
    <rect x="-60" y="-50" width="120" height="100" rx="14" fill="#ffffff" stroke="#C7D0DC" stroke-width="4"/>
    <rect x="-60" y="-50" width="120" height="32" rx="14" fill="#D93A2B"/>
    <text x="0" y="30" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="46" font-weight="800" fill="#0C2C52" text-anchor="middle">15</text>
  </g>

  <!-- bottom title bar -->
  <rect x="0" y="470" width="1200" height="160" fill="#000000" opacity="0.32"/>
  <text x="64" y="545" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="44" font-weight="800" fill="#ffffff">근로장려금 반기신청</text>
  <text x="64" y="590" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="500" fill="#ffffff" opacity="0.85">9월 15일 마감, 지금 확인하세요</text>
</svg>

