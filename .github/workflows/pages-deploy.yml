name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # 09:00, 12:00, 15:00, 18:00 Asia/Seoul (UTC+9)
  schedule:
    - cron: '0 0,3,6,9 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Verify scheduled post filtering
        run: |
          bundle exec ruby -rjekyll -rtmpdir -rfileutils <<'RUBY'
          config = Jekyll.configuration({"quiet" => true})
          abort "Scheduled posts must remain hidden" unless config["future"] == false
          Dir.mktmpdir("jekyll-schedule-test") do |root|
            source = File.join(root, "source")
            FileUtils.mkdir_p(File.join(source, "_posts"))
            {"2000-01-01-released" => "2000-01-01 09:00:00 +0900",
             "2999-01-01-scheduled" => "2999-01-01 09:00:00 +0900"}.each do |slug, date|
              File.write(File.join(source, "_posts", "#{slug}.md"), "---\ntitle: Probe\ndate: #{date}\n---\nProbe\n")
            end
            test_config = Jekyll.configuration({"source" => source, "destination" => File.join(root, "site"),
              "config" => [], "plugins" => [], "theme" => nil, "future" => config["future"],
              "timezone" => config["timezone"], "quiet" => true})
            site = Jekyll::Site.new(test_config)
            site.process
            abort "Scheduled post filtering failed" unless site.posts.docs.length == 1 && site.posts.docs.first.date.year == 2000
          end
          RUBY

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
